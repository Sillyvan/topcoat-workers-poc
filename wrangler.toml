name = "topcoat-workers-poc"
main = "build/index.js"
compatibility_date = "2026-07-24"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./static"

[build]
command = "bash ./build.sh"
watch_dir = "./src"
